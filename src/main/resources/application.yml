spring:
  application:
    name: aggregated-search
  # DataSource Config
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
#    url: jdbc:mysql://115.190.26.160:3306/my_aggregated_search_db
    url: jdbc:mysql://localhost:3306/my_aggregated_search_db
    username: root
    password: 123456
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
      # application.yml
    hiddenmethod:
      filter:
        enabled: false  # 禁用 HiddenHttpMethodFilter
  # session 失效时间（分钟）
  session:
    timeout: 86400
    store-type: redis


  # redis 配置
  redis:
    port: 6379
    host: 115.190.26.160
    database: 0
server:
  port: 7529
  servlet:
    context-path: /api
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名(since 3.3.0,配置后可以忽略不配置步骤2)
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
logging:
  level:
    org.springframework.boot: DEBUG
    org.springframework.web: DEBUG
    root: info  # 全局日志级别
    com.improve.fuqige.bronze: info  # 指定包路径的日志级别
  file:
    name: fuqige-bronze.log  # 日志文件名（原logging.file）
    path: ./logs  # 日志文件路径（原logging.path）
  pattern:
    console: "%cyan(%d{yyyy-MM-dd HH:mm:ss.SSS}) %yellow([%thread]) %highlight(%-5level) %boldGreen(%logger{80}[LineNumber:%L]): %highlight(%msg%n)"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{requestId}] %-5level --- [%thread] %logger{80}[LineNumber:%L]: %msg%n"